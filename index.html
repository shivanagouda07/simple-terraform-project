<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Static Website | Terraform S3</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 40px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.1rem;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      padding: 8px 16px;
      background: #00c6ff;
      color: #000;
      border-radius: 20px;
      font-weight: bold;
    }
    footer {
      margin-top: 25px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Static Website Deployed</h1>
    <p>This website is hosted on <strong>AWS S3</strong> and deployed using <strong>Terraform</strong>.</p>
    <span class="badge">DevOps Practice Project</span>
    <footer>
      <p>Infrastructure as Code • AWS • Terraform</p>
    </footer>
  </div>
</body>
</html>

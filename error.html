<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error | Page Not Found</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #232526, #414345);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 500px;
      padding: 40px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #ff6b6b;
    }
    p {
      font-size: 1.1rem;
      margin-bottom: 20px;
    }
    a {
      display: inline-block;
      padding: 10px 20px;
      text-decoration: none;
      background: #00c6ff;
      color: #000;
      border-radius: 6px;
      font-weight: bold;
    }
    a:hover {
      background: #00a8e8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>The page you are looking for does not exist.</p>
    <a href="index.html">Go Back Home</a>
  </div>
</body>
</html>
